<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر حلويات السعادة - Sukkari Bakery</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.5/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fff5f7;
            color: #4a2e35;
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.FramerMotion || window.Motion;

        const sweetsData = [
            { id: 1, name: 'تشيز كيك بالفراولة', price: '45 ر.س', desc: 'تشيز كيك غني بالطعم الكريمي مع صوص الفراولة الطازجة', image: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=500&q=80', tag: 'جديد' },
            { id: 2, name: 'كيكة الشوكولاتة البلجيكية', price: '55 ر.س', desc: 'طبقات من الشوكولاتة الفاخرة والغنيّة بالكاكاو', image: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=500&q=80', tag: 'جديد' },
            { id: 3, name: 'تارت الليمون والمرنج', price: '35 ر.س', desc: 'تارت مقرمش بحشوة الليمون المنعشة ومرنج محروق', image: 'https://images.unsplash.com/photo-1519869325930-281384150729?auto=format&fit=crop&w=500&q=80', tag: 'مميز' },
            { id: 4, name: 'ماكرون فرانسيس متنوع', price: '40 ر.س', desc: 'تشكيلة فاخرة من حبات الماكرون الفرنسية بنكهات متعددة', image: 'https://images.unsplash.com/photo-1569864358642-9d1684040f43?auto=format&fit=crop&w=500&q=80', tag: 'فاخر' },
            { id: 5, name: 'سيراب الإكلير الفرنسي', price: '30 ر.س', desc: 'إكلير محشو بكريمة الفانيليا المغطى بالشوكولاتة', image: 'https://images.unsplash.com/photo-1612204003264-3290f59456bf?auto=format&fit=crop&w=500&q=80', tag: 'مقرمش' },
            { id: 6, name: 'كنافة بالقشطة والبلورات', price: '50 ر.س', desc: 'كنافة ذهبية مقرمشة محشوة بقشطة طازجة وعسل طبيعي', image: 'https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?auto=format&fit=crop&w=500&q=80', tag: 'تقليدي' },
            { id: 7, name: 'بقلاوة بالفستق الحلبي', price: '60 ر.س', desc: 'رقائق العجين المقرمشة المحشوة بأجود أنواع الفستق', image: 'https://images.unsplash.com/photo-1599785209707-a456fc1337bb?auto=format&fit=crop&w=500&q=80', tag: 'فاخر' },
            { id: 8, name: 'كب كيك الفانيليا والمارشميلو', price: '25 ر.س', desc: 'كب كيك إسفنجي خفيف مع زينة كريمة الزبدة والمارشميلو', image: 'https://images.unsplash.com/photo-1576618148400-f54bed99fcfd?auto=format&fit=crop&w=500&q=80', tag: 'للأطفال' }
        ];

        function App() {
            const scrollContainerRef = useRef(null);
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [orderSuccess, setOrderSuccess] = useState(false);

            const scroll = (direction) => {
                if (scrollContainerRef.current) {
                    const scrollAmount = 350;
                    scrollContainerRef.current.scrollBy({
                        left: direction === 'right' ? scrollAmount : -scrollAmount,
                        behavior: 'smooth'
                    });
                }
            };

            const addToCart = (sweet) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === sweet.id);
                    if (existing) {
                        return prev.map(item => item.id === sweet.id ? {...item, qty: item.qty + 1} : item);
                    }
                    return [...prev, {...sweet, qty: 1}];
                });
                setIsCartOpen(true);
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
            };

            const totalPrice = cart.reduce((sum, item) => sum + (parseFloat(item.price) * item.qty), 0);

            return React.createElement('div', { className: 'min-h-screen flex flex-col bg-[#fff5f7]' },
                // Header
                React.createElement('header', { className: 'sticky top-0 z-50 bg-white/85 backdrop-blur-md border-b border-pink-100 shadow-sm' },
                    React.createElement('div', { className: 'max-w-7xl mx-auto px-4 py-4 flex justify-between items-center' },
                        React.createElement('div', { className: 'flex items-center gap-2' },
                            React.createElement('span', { className: 'text-2xl font-black text-pink-600' }, '🧁 حلويات السعادة'),
                        ),
                        React.createElement('button', { 
                            onClick: () => setIsCartOpen(true),
                            className: 'relative bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-full font-semibold transition flex items-center gap-2 shadow-md shadow-pink-200'
                        },
                            '🛒 السلة',
                            cart.length > 0 && React.createElement('span', { className: 'absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold' },
                                cart.reduce((acc, item) => acc + item.qty, 0)
                            )
                        )
                    )
                ),

                // Hero Section with Added Image Gallery/Banner
                React.createElement('section', { className: 'py-16 px-4 text-center bg-gradient-to-b from-pink-100/50 to-transparent' },
                    React.createElement(motion.div, {
                        initial: { opacity: 0, y: 20 },
                        animate: { opacity: 1, y: 0 },
                        transition: { duration: 0.6 },
                        className: 'max-w-4xl mx-auto'
                    },
                        React.createElement('h1', { className: 'text-4xl md:text-5xl font-black text-pink-900 mb-4' }, 'عالم من السعادة والحلويات الفاخرة'),
                        React.createElement('p', { className: 'text-lg text-pink-700 mb-8' }, 'اكتشف تشكيلتنا الفريدة من ألذ الحلويات المصنوعة بحب وعناية فائقة.'),
                        
                        // Added Additional Featured Images Grid
                        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4 mb-8' },
                            React.createElement('div', { className: 'relative h-64 rounded-2xl overflow-hidden shadow-lg border border-pink-200' },
                                React.createElement('img', { 
                                    src: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80', 
                                    alt: 'تشكيلة مميزة',
                                    className: 'w-full h-full object-cover hover:scale-105 transition duration-500'
                                }),
                                React.createElement('div', { className: 'absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex items-end p-4' },
                                    React.createElement('span', { className: 'text-white font-bold text-lg' }, '✨ مخبوزات طازجة يومياً')
                                )
                            ),
                            React.createElement('div', { className: 'relative h-64 rounded-2xl overflow-hidden shadow-lg border border-pink-200' },
                                React.createElement('img', { 
                                    src: 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=800&q=80', 
                                    alt: 'حلويات فاخرة',
                                    className: 'w-full h-full object-cover hover:scale-105 transition duration-500'
                                }),
                                React.createElement('div', { className: 'absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent flex items-end p-4' },
                                    React.createElement('span', { className: 'text-white font-bold text-lg' }, '💖 أطعم الشوكولاتة البلجيكية')
                                )
                            )
                        ),

                        React.createElement('div', { className: 'flex justify-center gap-4 text-sm font-semibold text-pink-600' },
                            React.createElement('span', { className: 'bg-white px-4 py-2 rounded-full shadow-sm border border-pink-100' }, '✨ مكونات طازجة 100%'),
                            React.createElement('span', { className: 'bg-white px-4 py-2 rounded-full shadow-sm border border-pink-100' }, '🚚 توصيل سريع لبارد وساخن'),
                        )
                    )
                ),

                // Sweets Slider Section with Right/Left Swipe
                React.createElement('section', { className: 'py-12 px-4 max-w-7xl mx-auto w-full' },
                    React.createElement('div', { className: 'flex justify-between items-center mb-6' },
                        React.createElement('div', {},
                            React.createElement('h2', { className: 'text-2xl md:text-3xl font-black text-pink-900' }, 'قائمة الحلويات المميزة'),
                            React.createElement('p', { className: 'text-sm text-pink-600' }, 'اسحب يمين ويسار لتصفح كافة الأنواع المتاحة')
                        ),
                        React.createElement('div', { className: 'flex gap-2' },
                            React.createElement('button', { 
                                onClick: () => scroll('right'),
                                className: 'bg-white border-2 border-pink-300 hover:bg-pink-500 hover:text-white hover:border-pink-500 text-pink-700 w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg transition shadow'
                            }, '→'),
                            React.createElement('button', { 
                                onClick: () => scroll('left'),
                                className: 'bg-white border-2 border-pink-300 hover:bg-pink-500 hover:text-white hover:border-pink-500 text-pink-700 w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg transition shadow'
                            }, '←')
                        )
                    ),

                    // Scrollable Container
                    React.createElement('div', { 
                        ref: scrollContainerRef,
                        className: 'flex gap-6 overflow-x-auto hide-scrollbar pb-8 pt-4 px-2 snap-x snap-mandatory'
                    },
                        sweetsData.map((sweet) => 
                            React.createElement(motion.div, {
                                key: sweet.id,
                                whileHover: { y: -8 },
                                className: 'min-w-[280px] md:min-w-[320px] bg-white rounded-2xl shadow-lg border border-pink-100 overflow-hidden snap-center flex flex-col justify-between'
                            },
                                React.createElement('div', { className: 'relative h-48 overflow-hidden' },
                                    React.createElement('img', { 
                                        src: sweet.image, 
                                        alt: sweet.name,
                                        className: 'w-full h-full object-cover transition duration-300 hover:scale-110'
                                    }),
                                    React.createElement('span', { className: 'absolute top-3 right-3 bg-pink-600 text-white text-xs font-bold px-3 py-1 rounded-full shadow' },
                                        sweet.tag
                                    )
                                ),
                                React.createElement('div', { className: 'p-5 flex flex-col flex-grow justify-between' },
                                    React.createElement('div', {},
                                        React.createElement('div', { className: 'flex justify-between items-start mb-2' },
                                            React.createElement('h3', { className: 'font-bold text-lg text-gray-800' }, sweet.name),
                                            React.createElement('span', { className: 'font-black text-pink-600 text-lg' }, sweet.price)
                                        ),
                                        React.createElement('p', { className: 'text-gray-500 text-sm mb-4 line-clamp-2' }, sweet.desc)
                                    ),
                                    React.createElement('button', {
                                        onClick: () => addToCart(sweet),
                                        className: 'w-full bg-pink-100 hover:bg-pink-600 text-pink-700 hover:text-white font-bold py-2.5 rounded-xl transition duration-300 text-center'
                                    }, 'أضف للسلة 🛒')
                                )
                            )
                        )
                    )
                ),

                // Cart Drawer Modal
                isCartOpen && React.createElement('div', { className: 'fixed inset-0 z-50 flex justify-end bg-black/50 backdrop-blur-sm' },
                    React.createElement(motion.div, {
                        initial: { x: '100%' },
                        animate: { x: 0 },
                        exit: { x: '100%' },
                        className: 'w-full max-w-md bg-white h-full shadow-2xl flex flex-col p-6'
                    },
                        React.createElement('div', { className: 'flex justify-between items-center pb-4 border-b border-gray-100' },
                            React.createElement('h2', { className: 'text-xl font-black text-pink-900' }, 'سلة المشتريات'),
                            React.createElement('button', { 
                                onClick: () => setIsCartOpen(false),
                                className: 'text-gray-400 hover:text-gray-600 font-bold text-xl'
                            }, '✕')
                        ),

                        // Cart Items List
                        React.createElement('div', { className: 'flex-grow overflow-y-auto py-4 space-y-4' },
                            cart.length === 0 ? 
                                React.createElement('div', { className: 'text-center py-20 text-gray-400' },
                                    React.createElement('p', { className: 'text-5xl mb-3' }, '🛒'),
                                    React.createElement('p', {}, 'السلة فارغة حالياً')
                                ) :
                                cart.map(item => 
                                    React.createElement('div', { key: item.id, className: 'flex items-center justify-between bg-pink-50/50 p-3 rounded-xl border border-pink-100' },
                                        React.createElement('div', { className: 'flex items-center gap-3' },
                                            React.createElement('img', { src: item.image, alt: item.name, className: 'w-14 h-14 object-cover rounded-lg' }),
                                            React.createElement('div', {},
                                                React.createElement('h4', { className: 'font-bold text-sm text-gray-800' }, item.name),
                                                React.createElement('span', { className: 'text-xs text-pink-600 font-semibold' }, `${item.price} × ${item.qty}`)
                                            )
                                        ),
                                        React.createElement('button', { 
                                            onClick: () => removeFromCart(item.id),
                                            className: 'text-red-400 hover:text-red-600 font-bold px-2 py-1'
                                        }, '🗑️')
                                    )
                                )
                        ),

                        // Cart Footer
                        cart.length > 0 && React.createElement('div', { className: 'pt-4 border-t border-gray-100' },
                            React.createElement('div', { className: 'flex justify-between items-center mb-4 text-lg font-black text-gray-800' },
                                React.createElement('span', {}, 'المجموع الكلي:'),
                                React.createElement('span', { className: 'text-pink-600' }, `${totalPrice} ر.س`)
                            ),
                            React.createElement('button', {
                                onClick: () => {
                                    setOrderSuccess(true);
                                    setCart([]);
                                    setTimeout(() => {
                                        setOrderSuccess(false);
                                        setIsCartOpen(false);
                                    }, 3000);
                                },
                                className: 'w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-pink-200'
                            }, 'إتمام الطلب الآن')
                        ),

                        orderSuccess && React.createElement('div', { className: 'absolute inset-0 bg-white/95 flex flex-col items-center justify-center text-center p-6' },
                            React.createElement('span', { className: 'text-6xl mb-4' }, '🎉'),
                            React.createElement('h3', { className: 'text-2xl font-black text-pink-900 mb-2' }, 'تم استلام طلبك بنجاح!'),
                            React.createElement('p', { className: 'text-gray-600 text-sm' }, 'جاري تجهيز حلوياتك بكل حب وطازجة إليك.')
                        )
                    )
                ),

                // Footer
                React.createElement('footer', { className: 'bg-white border-t border-pink-100 py-6 text-center text-sm text-pink-700 mt-auto' },
                    React.createElement('p', {}, 'جميع الحقوق محفوطة © متجر حلويات السعادة 2024')
                )
            );
        }

        const root = document.getElementById('root');
        ReactDOM.createRoot(root).render(React.createElement(App));
    </script>
</body>
</html>
